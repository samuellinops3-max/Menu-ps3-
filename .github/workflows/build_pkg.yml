name: Compilar PKG Sem Erros

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Iniciar Ambiente
      uses: actions/checkout@v4

    - name: Baixar Ferramentas
      run: |
        sudo apt-get update
        sudo apt-get install -y wget python3
        wget https://githubusercontent.com

    - name: Gerar Menu Automaticamente
      run: |
        echo "Content-ID = UP0001-MEUMENU01_00-0000111122223333" > package.conf
        echo "PackageType = Homebrew" >> package.conf
        mkdir -p input/C00/USRDIR
        echo '<?xml version="1.0" encoding="utf-8"?><XMBLayout version="1.0"><Item class="type:x-xmb/folder-items" name="central_temas" title="Central de Temas" icon="tex: those_icons"><Item class="type:x-xmb/folder-items" name="sub_temas" title="Baixar Temas Completos (.p3t)"><Item class="type:x-xmb/action" name="tema_1" title="Baixar Tema: Retro Gaming" module="webbrowser" action="http://ps3-themes.com"/></Item><Item class="type:x-xmb/folder-items" name="sub_wallpapers" title="Baixar Papéis de Parede (1080p)"><Item class="type:x-xmb/action" name="wall_1" title="Baixar Wallpaper: PlayStation Classic" module="webbrowser" action="https://hdqwalls.com"/></Item></Item></XMBLayout>' > input/C00/USRDIR/category_container.xml

    - name: Criar PKG
      run: |
        python3 make_package_npdrm.py package.conf input
        mv *.pkg MeuMenuPS3.pkg

    - name: Upload do PKG
      uses: actions/upload-artifact@v4
      with:
        name: Meu-PKG-Pronto
        path: MeuMenuPS3.pkg
        
