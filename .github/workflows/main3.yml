name: Gerar Estrutura PS3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar os arquivos
      uses: actions/checkout@v4

    - name: Compactar Arquivos para o PS3
      run: |
        mkdir -p pacote_final
        cp -r C00 pacote_final/
        cd pacote_final
        zip -r ../MenuPS3_XMB.zip ./*

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Arquivos-do-Menu-PS3
        path: MenuPS3_XMB.zip
        
